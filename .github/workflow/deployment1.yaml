name: Deployment project1
on: push
Jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '14'
      - name: Install dependencies
        run: npm ci
      - name: Run Lint
        run: npm run lint
      - name: Run Tests
        run: npm test
      - name: Build project
        run: npm run build
      - name: Deploy to server
        run: echo "Deploying to server..." 
          scp -r ./dist user@your-server:/path/to/deploy
          ssh user@your-server 'cd /path/to/deploy && npm install --production'
    branches:
      - main